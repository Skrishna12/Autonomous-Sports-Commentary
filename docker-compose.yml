services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ascs
      POSTGRES_PASSWORD: ascs
      POSTGRES_DB: ascs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ascs"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: uvicorn ascs.api.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg2://ascs:ascs@postgres:5432/ascs
      MLFLOW_TRACKING_URI: http://mlflow:5000
      TTS_ENGINE: synthetic
      ASR_ENGINE: disabled
      DEFAULT_LANGUAGE: en
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 8

  streamlit:
    build: .
    command: streamlit run streamlit_app/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      STREAMLIT_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

  tts:
    build:
      context: .
      dockerfile: services/tts/Dockerfile
    environment:
      TTS_ENGINE: synthetic
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data

  asr:
    build:
      context: .
      dockerfile: services/asr/Dockerfile
    environment:
      ASR_ENGINE: disabled
    ports:
      - "8002:8002"
    volumes:
      - ./data:/app/data

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlartifacts
    ports:
      - "5000:5000"
    volumes:
      - mlruns:/mlartifacts

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
  mlruns:
